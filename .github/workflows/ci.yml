name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: this workflow only checks the code, it never writes to the repo.
permissions:
  contents: read

# No repository secrets are used. These make it explicit that CI runs against the
# mock providers and can never call the real Google APIs.
env:
  USE_MOCK_GEOCODING: 'true'
  USE_MOCK_PLACES: 'true'
  GOOGLE_MAPS_API_KEY: ''

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + migrations + test)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A throwaway PostgreSQL 18 that exists only for this job. The password below
    # is a literal on purpose: it protects nothing (the container lives for a few
    # minutes on the runner and is not reachable from outside), so it is not a
    # secret and needs no secret store.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: bli
          POSTGRES_PASSWORD: ci-only-throwaway-password
          POSTGRES_DB: bli_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bli -d bli_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # The database name must end in "_test": the test helpers refuse to run
      # against anything else.
      TEST_DATABASE_URL: postgres://bli:ci-only-throwaway-password@localhost:5432/bli_test

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run lint

      # The service health check already gates the job; this confirms the
      # database really answers queries before anything depends on it.
      - name: Wait for PostgreSQL
        run: npm run db:wait -- TEST_DATABASE_URL 60

      - name: Apply migrations
        run: npm run db:migrate:test

      # Migrations must be idempotent: a second run has nothing left to do.
      - name: Apply migrations again (idempotence)
        run: |
          npm run db:migrate:test 2>&1 | tee second-run.log
          grep -q "No migrations to run" second-run.log

      - run: npm test

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
